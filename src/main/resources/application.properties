# Puerto del servidor (usa variable PORT o 8080 por defecto)
server.port=${PORT:8080}

# Nivel de logging para org.atmosphere
logging.level.org.atmosphere=warn

# Lanzar navegador por defecto en modo desarrollo
vaadin.launch-browser=true

# Paquetes permitidos para Vaadin
vaadin.allowed-packages=com.vaadin,org.vaadin,org.unl.music

# Open-in-view para JPA (deshabilitado para evitar problemas con lazy loading)
spring.jpa.open-in-view=false

# Inicializar Entity Manager antes de data.sql para crear esquema y datos
spring.jpa.defer-datasource-initialization=true

# Permitir sobreescritura de beans para evitar conflicto de beans duplicados
spring.main.allow-bean-definition-overriding=true
logging.level.org.apache.catalina=TRACE
logging.level.org.apache.coyote=TRACE
logging.level.org.apache.tomcat=TRACE
